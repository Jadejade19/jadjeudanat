<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3730a3">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Révisions anat">
<title>Révisions anat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--body0:#e6dcc8;--bodyline:#8e94b3;--bg:#f4f5fb;--card:#fff;--ink:#1c1f33;--muted:#606680;--accent:#3730a3;--accent-soft:#e6e5fb;--line:#dfe1ee;--ok:#15803d;--ok-bg:#dcfce7;--ko:#b91c1c;--ko-bg:#fee2e2;--todo:#c9ccdc;--on-accent:#fff;--head:#3730a3}
@media (prefers-color-scheme: dark){:root{--body0:#6b6254;--bodyline:#8a90b0;--bg:#12131c;--card:#1c1e2b;--ink:#e8e9f3;--muted:#a3a7c0;--accent:#a5b4fc;--accent-soft:#2a2d49;--line:#2e3146;--ok:#4ade80;--ok-bg:#163322;--ko:#f87171;--ko-bg:#3a1a1a;--todo:#3a3d55;--on-accent:#11132a;--head:#2b2780}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px}
header h1{font-size:1.02rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header a{color:#fff;text-decoration:none;font-size:1.18rem;padding:4px 7px;border-radius:8px;line-height:1}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 4px;scrollbar-width:none;max-width:760px;margin:0 auto}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:.92rem;white-space:nowrap}
nav.tabs a.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
main{max-width:760px;margin:0 auto;padding:10px 12px 28px}
h2{font-size:1.1rem;margin:0 0 6px}
p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.small{font-size:.86rem;color:var(--muted)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--todo);margin:10px 0 6px}
.stack div{height:100%}
.stack .g{background:var(--ok)} .stack .r{background:var(--ko)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.big{font-size:1.02rem;font-weight:600;margin:2px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.chips button{font:inherit;font-size:.85rem;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.pools{display:grid;gap:10px}
.pool{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--todo);border-radius:14px;padding:14px;cursor:pointer}
.pool.ko{border-left-color:var(--ko)} .pool.ok{border-left-color:var(--ok)} .pool.todo{border-left-color:var(--accent)}
.pool:disabled{opacity:.5;cursor:default}
.pool .n{font-size:1.5rem;font-weight:700;min-width:3.2ch;text-align:right}
.pool .t{flex:1}
.pool .t b{display:block;font-size:1rem}
.range{display:flex;align-items:center;gap:10px;margin-top:6px}
.range input{flex:1;accent-color:var(--accent)}
.range output{min-width:4.5ch;text-align:right;font-weight:600}
button,.btn{font:inherit;padding:10px 14px;border-radius:11px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;text-decoration:none;display:inline-block}
button.primary,.btn.primary{background:var(--accent);color:var(--on-accent)}
button.danger{border-color:var(--ko);color:var(--ko)}
button.sm{padding:6px 10px;font-size:.82rem;border-radius:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font-size:.78rem;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.qtext{font-size:1.08rem;font-weight:600;line-height:1.45;margin:12px 0 4px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:.97rem;line-height:1.4;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.opt .k{flex:0 0 auto;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem}
.opt.good{border-color:var(--ok);background:var(--ok-bg)} .opt.good .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--ko);background:var(--ko-bg)} .opt.bad .k{background:var(--ko);color:#fff}
.opt:disabled{cursor:default;opacity:1}
.opt.dim{opacity:.55}
.verdict{font-weight:700;font-size:1.05rem;margin:14px 0 4px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--ko)}
.pet-say{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:.92rem;animation:pop .45s}
.pet-say .av{font-size:1.45rem;flex:0 0 auto}
.expl{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.93rem;line-height:1.5}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-weight:600}
.facts{margin:8px 0 0;padding:0;list-style:none}
.facts li{padding:7px 0;border-top:1px solid var(--line);font-size:.92rem;line-height:1.45}
.facts li b{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
input[type=search]{font:inherit;width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.list a{display:flex;justify-content:space-between;gap:8px;padding:11px 4px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.list a:first-child{border-top:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:3px}
.msg{min-height:1.2em;font-size:.9rem;color:var(--muted);margin-top:8px}
.flag{font-size:.85rem;padding:7px 11px;border-color:var(--line);color:var(--muted)}
.flag.on{border-color:var(--ko);color:var(--ko)}
.hidden{display:none !important}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.pics.big{grid-template-columns:1fr}
img.pic{width:100%;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:zoom-in;min-height:60px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center;padding:10px}
#zoom img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:8px}
.levels a{display:block;text-align:center;padding:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
.levels a.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.subtabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.subtabs a{flex:1 1 auto;text-align:center;padding:9px 10px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:var(--card);font-size:.9rem}
.subtabs a.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.palpa{border-left:4px solid var(--accent);padding:6px 0 6px 10px;margin-top:10px}
.revbtn{display:block;text-align:center;margin-top:12px}
nav.tabs a.on .small{color:inherit;opacity:.85}
.opt.sel{border-color:var(--accent,#2563eb);box-shadow:inset 0 0 0 1px var(--accent,#2563eb)}
figure.web{margin:10px 0}figure.web img{max-height:340px;width:auto;max-width:100%;background:#fff}figure.web figcaption{overflow-wrap:anywhere}
.lvcard{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.lvrow{display:flex;gap:12px;align-items:center}
.lvbadge{flex:0 0 auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.25rem;background:linear-gradient(135deg,#fef3c7,#facc15 55%,#ca8a04);color:#713f12;box-shadow:0 2px 8px rgba(202,138,4,.35)}
.lvcard .t b,.lvrow .t b{display:block}
.xpbar{height:8px;border-radius:99px;background:var(--todo);overflow:hidden;margin-top:6px}
.xpbar div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#facc15)}
.joybar{height:9px;border-radius:99px;background:var(--todo);overflow:hidden;margin-top:6px}
.joybar div{height:100%;border-radius:99px;background:linear-gradient(90deg,#f59e0b,#22c55e)}
.bodywrap{display:flex;justify-content:center;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:4px 0 8px;border-radius:14px;padding:12px;position:relative;overflow:hidden;border:1px solid var(--line)}
.bodywrap.scene-none{background:var(--bg)}
.bodywrap.scene-sun{background:linear-gradient(180deg,#bae6fd 0%,#fef9c3 100%)}
.bodywrap.scene-cloud{background:linear-gradient(180deg,#cbd5e1 0%,#e2e8f0 100%)}
.bodywrap.scene-storm{background:linear-gradient(180deg,#334155 0%,#1e293b 100%)}
.bodywrap.scene-rainbow{background:linear-gradient(180deg,#e0f2fe 0%,#fce7f3 55%,#fef3c7 100%)}
.bodywrap.scene-night{background:linear-gradient(180deg,#0f172a 0%,#312e81 100%)}
.scene-badge{position:absolute;top:8px;right:10px;font-size:1.5rem;pointer-events:none;z-index:1}
.bodywrap svg{height:min(54vh,460px);width:auto;max-width:100%;overflow:visible;position:relative;z-index:2}
.pet-box{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:145px;max-width:210px;padding:10px;border-radius:12px;background:rgba(255,255,255,.86);border:1px solid var(--line);z-index:2;text-align:center;color:var(--ink)}
@media (prefers-color-scheme: dark){.pet-box{background:rgba(28,30,43,.88)}}
.pet-family{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.pet-art{font-size:2.3rem;line-height:1.1}
.pet-baby{font-size:1.45rem;line-height:1.1}
.pet-name{font-size:.82rem;font-weight:700;margin-top:4px}
.pet-gear{font-size:.74rem;color:var(--muted);margin-top:2px}
.bz{cursor:pointer;stroke:var(--bodyline);stroke-width:1.1;transition:fill .45s}
.bz:active{opacity:.75}
.acc{pointer-events:none}
.sel *{fill:none;stroke:var(--accent);stroke-width:2.6}
.rewards{display:grid;gap:8px;margin-top:12px;max-height:380px;overflow-y:auto}
.rw{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.rw .ico{font-size:1.5rem;width:1.7em;text-align:center}
.rw .t{flex:1}.rw .t b{display:block;font-size:.93rem}
.list .ics{letter-spacing:1px}
.xp{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:99px;background:linear-gradient(90deg,#fef3c7,#facc15);color:#713f12;font-size:.85rem;vertical-align:1px;animation:pop .5s}
.streak{display:inline-block;margin-left:6px;font-size:.88rem;color:#ea580c;font-weight:600}
.unlock{display:flex;gap:12px;align-items:center;margin-top:10px;padding:11px 13px;border-radius:12px;background:linear-gradient(135deg,#fef3c7,#fde68a);color:#713f12;text-decoration:none;font-size:1.6rem;animation:pop .6s}
.unlock.animal{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#14532d}
.unlock.daily{background:linear-gradient(135deg,#e0e7ff,#c7d2fe);color:#1e1b4b}
.unlock span{font-size:.95rem}.unlock b{display:block}.unlock .small{color:inherit;opacity:.85}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px}
.mcard{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.mcard.comp{border-color:var(--ok);background:var(--ok-bg)}
.mcard .top{display:flex;gap:8px;align-items:center}
.mcard .em{font-size:1.8rem}
.mcard b{display:block;font-size:.92rem}
.art-frame{border:3px solid #92400e;border-radius:10px;padding:10px;background:linear-gradient(135deg,#fef3c7,#fffbeb);color:#1c1f33;margin-top:8px}
@media (prefers-color-scheme: dark){.art-frame{background:#292524;color:#f5f5f4;border-color:#d97706}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<header>
  <a href="#/g" aria-label="Accueil">⌂</a>
  <h1 id="title">Révisions anat</h1>
  <a href="#/corps" aria-label="Mon corps d'anat">🧍</a>
  <a href="#/menagerie" aria-label="La ménagerie">🐾</a>
  <a href="#/fiches" aria-label="Fiches">🔎</a>
  <a href="#/reglages" aria-label="Réglages">⚙</a>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="app"><div class="card">Chargement des questions…</div></main>

<script src="questions.js"></script>
<script>
"use strict";
const D = window.QDATA || { questions: [], fiches: {}, sources: {}, regions: {} };
const QS = D.questions;
const BY_ID = Object.fromEntries(QS.map(q => [q.id, q]));
const TABS = [
  { id: "g", label: "Général", cat: null },
  { id: "muscle", label: "Muscles", cat: "muscle" },
  { id: "nerf", label: "Nerfs", cat: "nerf" },
  { id: "ligament", label: "Ligaments", cat: "ligament" },
  { id: "artic", label: "Articulations", cat: "artic" },
  { id: "os", label: "Os", cat: "os" },
  { id: "autre", label: "Autres", cat: "autre" },
  { id: "palpa", label: "Palpation", cat: "palpa" }
];
const POOLS = {
  ko: { label: "Échecs", hint: "Les QCM où tu t'es trompée la dernière fois" },
  todo: { label: "Structures pas encore interrogées", hint: "Les QCM que tu n'as encore jamais faits" },
  ok: { label: "Déjà eu bon", hint: "Les QCM réussis la dernière fois" }
};
const REG_LABEL = { all: "Tout", ms: "Membre sup.", mi: "Membre inf.", ax: "Tête, cou, tronc" };
const CAT_LABEL = { muscle: "Muscle", nerf: "Nerf", ligament: "Ligament", artic: "Articulation", os: "Os", autre: "Autre", palpa: "Palpation" };
const CAT_PLURAL = { muscle: "Muscles", nerf: "Nerfs", ligament: "Ligaments", artic: "Articulations", os: "Os", autre: "Autres", palpa: "Palpation" };

const PACKS = {};
function loadPack(p) {
  return PACKS[p] || (PACKS[p] = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = p + ".js";
    s.onload = res; s.onerror = () => { delete PACKS[p]; rej(new Error("image indisponible")); };
    document.head.appendChild(s);
  }));
}
const imgTags = keys => (keys || []).filter(k => D.imgs && D.imgs[k]).map(k => `<img class="pic" data-k="${esc(k)}" alt="Image du cours" loading="lazy">`).join("");
const webImg = f => !f || !f.web || !D.imgs[f.web[0]] ? "" : `<figure class="web"><div class="pics">${imgTags([f.web[0]])}</div><figcaption class="small">${f.web[1] ? "Planche d'ensemble de la région ou de l'os : la structure n'y est pas toujours légendée. " : ""}Image ajoutée (hors cours) · Wikimedia Commons : <a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent((D.imgCap[f.web[0]] || "").split(" – ")[0])}" target="_blank" rel="noopener">${esc(D.imgCap[f.web[0]] || "")}</a></figcaption></figure>`;
function hydrateImgs() {
  document.querySelectorAll("img.pic[data-k]:not([src])").forEach(el => {
    if (el.closest("details:not([open])")) return;
    const k = el.dataset.k, p = D.imgs[k];
    if (!p) return;
    loadPack(p).then(() => { if (window.IMGP && IMGP[k]) el.src = IMGP[k]; }).catch(() => { el.alt = navigator.onLine ? "Image absente du site : fichier " + p + ".js introuvable sur GitHub" : "Image indisponible hors ligne (jamais affichée)"; });
  });
}

const K_PROG = "revanat-progress-v1", K_SET = "revanat-settings-v1", K_FLAG = "revanat-flags-v1";
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
let PROG = load(K_PROG, {});
let SET = load(K_SET, { reg: "all", len: 20 });
let FLAGS = load(K_FLAG, {});
const K_OVR = "revanat-corrections-v1"; let OVR = load(K_OVR, {});
const applyOvr = () => { for (const id in OVR) { const q = BY_ID[id]; if (q) { q.q = OVR[id].q; q.a = OVR[id].a; if (q.m) { q.m = q.a.split(" ; "); q.d = q.d.filter(x => !q.m.includes(x)); } else q.d = q.d.filter(x => x !== q.a); } } };
applyOvr();

const K_WLAST = "revanat-widget-last-v1";
function qsHash() {
  let h = 0x811c9dc5;
  for (let i = 0; i < QS.length; i++) { const s = (i ? "\n" : "") + QS[i].id; for (let j = 0; j < s.length; j++) { h ^= s.charCodeAt(j); h = Math.imul(h, 0x01000193) >>> 0; } }
  return h >>> 0;
}
function widgetLink() {
  const bytes = new Uint8Array(Math.ceil(QS.length / 8));
  QS.forEach((q, i) => { if (PROG[q.id]) bytes[i >> 3] |= 1 << (i & 7); });
  let bin = ""; bytes.forEach(b => { bin += String.fromCharCode(b); });
  const d = btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const back = location.href.split("#")[0] + "#/widget";
  return `intent://sync?h=${qsHash()}&w=${load(K_WLAST, 0)}&d=${d}#Intent;scheme=revanat;package=fr.jadanat.revwidget;S.browser_fallback_url=${encodeURIComponent(back)};end`;
}
function importWidget(payload) {
  if (!payload) return "";
  let data;
  try { data = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(payload.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0)))); }
  catch { return "Lien du widget illisible."; }
  const last = load(K_WLAST, 0); let max = last, n = 0, ok = 0;
  for (const [id, r, t] of (data.r || [])) {
    if (!BY_ID[id] || !(t > last)) continue;
    const p = PROG[id] || { n: 0, ok: 0 };
    p.n++; if (r) p.ok++;
    if (!(p.t > t)) { p.r = r ? 1 : 0; p.t = t; }
    PROG[id] = p; n++; if (r) ok++; if (t > max) max = t;
  }
  save(K_PROG, PROG); save(K_WLAST, max);
  const fresh = syncUnlocks();
  if (fresh.length) return `✔ ${plural(n, "réponse")} du widget enregistrée(s). 🎁 Débloqué : ${fresh.map(r => r.ico + " " + r.name).join(", ")} ! (voir 🧍 Mon corps)`;
  return n ? `✔ ${plural(n, "réponse")} du widget ${n > 1 ? "enregistrées" : "enregistrée"} : ${ok} dans « Déjà eu bon », ${n - ok} dans « Échecs ».` : "Ces réponses du widget étaient déjà enregistrées.";
}
const widgetBtn = () => `<a class="btn primary" href="${esc(widgetLink())}">📲 Mettre à jour le widget</a>`;
function viewWidget() {
  const msg = MSG; MSG = "";
  return `<section class="card"><h2>📲 Widget Android</h2>
      ${msg ? `<p class="big">${esc(msg)}</p>` : ""}
      <p class="small">Touche « Mettre à jour le widget » : il saura quels QCM tu as déjà faits ici et ne te proposera que des structures pas encore interrogées.</p>
      <div class="actions">${widgetBtn()}<a class="btn" href="#/g">Accueil</a></div></section>`;
}
let SESSION = null;
let MSG = "";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s);
const status = q => { const p = PROG[q.id]; return !p ? "todo" : p.r ? "ok" : "ko"; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const plural = (n, s, p) => `${n} ${n > 1 ? (p || s + "s") : s}`;
const cap = s => { s = String(s ?? ""); return s.charAt(0).toUpperCase() + s.slice(1); };
const srcText = src => src ? `${D.sources[src[0]] || src[0]}, page ${src[1]} du PDF` : "";

function todayKey(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function questionsOf(tab, reg = SET.reg) {
  const t = TABS.find(x => x.id === tab);
  return QS.filter(q => (!t || !t.cat || q.c === t.cat) && (reg === "all" || q.r === reg));
}
function stats(list) {
  let ok = 0, ko = 0;
  for (const q of list) { const s = status(q); if (s === "ok") ok++; else if (s === "ko") ko++; }
  return { total: list.length, ok, ko, done: ok + ko, todo: list.length - ok - ko };
}
const pct = (a, b) => b ? (a / b * 100) : 0;

function syncDailyState() {
  const tk = todayKey();
  if (DAILY.todayKey !== tk) {
    if (DAILY.lastActiveDay !== todayKey(-1) && DAILY.lastActiveDay !== tk) {
      DAILY.streak = 0;
    }
    DAILY.todayKey = tk;
    DAILY.todayGood = 0;
    DAILY.todayRewardClaimed = false;
    DAILY.kibbleEarnedToday = false;
    save(K_DAILY, DAILY);
  }
}
syncDailyState();

function recordDailyGoodAnswer() {
  syncDailyState();
  const tk = todayKey();
  if (DAILY.lastActiveDay !== tk) {
    if (DAILY.lastActiveDay === todayKey(-1)) DAILY.streak += 1;
    else DAILY.streak = 1;
    DAILY.lastActiveDay = tk;
  }
  DAILY.todayGood += 1;
  let newReward = null;
  let gotKibble = false;

  if (DAILY.todayGood >= 5 && !DAILY.kibbleEarnedToday) {
    DAILY.kibbleEarnedToday = true;
    DAILY.kibbles = (DAILY.kibbles || 0) + 1;
    gotKibble = true;
  }
  if (DAILY.todayGood >= 5 && !DAILY.todayRewardClaimed) {
    DAILY.todayRewardClaimed = true;
    const pool = DAILY_REWARDS.filter(r => !DAILY.got.includes(r.id));
    if (pool.length) {
      newReward = pool[Math.floor(Math.random() * pool.length)];
      DAILY.got.push(newReward.id);
      if (!DAILY.equipped[newReward.cat]) DAILY.equipped[newReward.cat] = newReward.id;
    }
  }
  save(K_DAILY, DAILY);
  return { newReward, gotKibble };
}

function petCare(id) {
  if (!id) return { happiness: 0, fedDays: 0, lastFedDay: null, babyId: null };
  PET.care[id] ||= { happiness: 0, fedDays: 0, lastFedDay: null, babyId: null };
  return PET.care[id];
}

function findBabyForParent(parent) {
  const sameFamily = ANIMALS.filter(a => a.family === parent.family && a.id !== parent.id && !PET.got.includes(a.id));
  const pool = sameFamily.length ? sameFamily : ANIMALS.filter(a => !PET.got.includes(a.id));
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}

function feedCompanionKibble() {
  syncDailyState();
  const compId = PET.companion;
  if (!compId) return { ok: false, msg: "Choisis d'abord un animal de compagnie dans La ménagerie." };
  if ((DAILY.kibbles || 0) <= 0) return { ok: false, msg: "Aucune croquette disponible : réussis 5 bonnes réponses aujourd'hui pour en gagner une !" };
  const c = petCare(compId);
  const tk = todayKey();
  if (c.lastFedDay === tk) return { ok: false, msg: "Tu as déjà donné la croquette du jour à ce compagnon !" };

  DAILY.kibbles -= 1;
  c.lastFedDay = tk;
  c.fedDays = (c.fedDays || 0) + 1;
  c.happiness = Math.min(100, (c.happiness || 0) + 20);

  let babyUnlocked = null;
  if (c.fedDays >= 5 && !c.babyId) {
    const parent = ANIMAL_BY_ID[compId];
    const baby = parent ? findBabyForParent(parent) : null;
    if (baby) {
      c.babyId = baby.id;
      if (!PET.got.includes(baby.id)) PET.got.push(baby.id);
      babyUnlocked = baby;
    }
  }
  save(K_DAILY, DAILY);
  save(K_PET, PET);
  if (babyUnlocked) {
    return { ok: true, msg: `🍼 Après 5 jours de croquettes, ton compagnon a eu un bébé : ${babyUnlocked.em} ${babyUnlocked.name} ! Il est à ses côtés et dans La ménagerie.` };
  }
  return { ok: true, msg: `🍖 Croquette donnée ! Bonheur : ${c.happiness} % (${c.fedDays}/5 jour(s) vers un bébé).` };
}

function recordAnimalProgress(isGood) {
  if (!isGood) return null;
  syncPetDay();
  PET.goodSincePet += 1;
  let unlocked = null;
  if (PET.goodSincePet >= PET.targetGood) {
    PET.goodSincePet = 0;
    PET.targetGood = randomTarget();
    if (PET.dayCount < 3) {
      const pool = ANIMALS.filter(a => !PET.got.includes(a.id));
      if (pool.length) {
        unlocked = pool[Math.floor(Math.random() * pool.length)];
        PET.got.push(unlocked.id);
        PET.dayCount += 1;
        petCare(unlocked.id);
        if (!PET.companion) PET.companion = unlocked.id;
      }
    }
  }
  save(K_PET, PET);
  return unlocked;
}

function startSession(tab, pool, ids, label) {
  let list;
  if (ids) list = ids.map(id => BY_ID[id]).filter(Boolean);
  else {
    list = questionsOf(tab).filter(q => status(q) === pool);
    shuffle(list);
    if (pool === "ko") list.sort((a, b) => (PROG[a.id]?.t || 0) - (PROG[b.id]?.t || 0));
  }
  if (SET.len < 100 && !ids) list = list.slice(0, SET.len);
  SESSION = { tab, pool, label: label || POOLS[pool].label, ids: list.map(q => q.id), pos: 0, answered: null, opts: null, ok: 0, ko: 0, streak: 0, badRun: 0, petMsg: null };
  if (location.hash === "#/quiz") { render(); window.scrollTo(0, 0); } else location.hash = "#/quiz";
}

function viewQuiz() {
  const S = SESSION;
  if (!S) return `<div class="card">Aucune série en cours. <a href="#/g">Retour</a></div>`;
  if (S.pos >= S.ids.length) {
    const tot = S.ok + S.ko;
    return `<section class="card"><h2>Série terminée</h2>
      <p class="big">${S.ok} / ${tot} bonnes réponses${tot ? ` (${Math.round(S.ok / tot * 100)} %)` : ""}</p>
      ${tot ? progressBlock({ ok: S.ok, ko: S.ko, todo: 0, total: tot }) : ""}
      ${S.xp ? `<p class="big">✨ +${S.xp} XP gagnés pendant cette série</p>` : ""}
      <div class="actions"><a class="btn primary" href="#/${S.tab || "g"}">Retour à l'onglet</a>
      ${S.ko ? `<button data-act="redoKo">Refaire mes erreurs de cette série (${S.ko})</button>` : ""}</div>
      <div class="actions">${widgetBtn().replace("btn primary", "btn")}</div></section>`;
  }
  const q = BY_ID[S.ids[S.pos]];
  if (!S.opts) {
    if (q.m) {
      const k = Math.min(q.m.length, 2 + Math.floor(Math.random() * 4));
      S.opts = shuffle([...shuffle(q.m.slice()).slice(0, k), ...shuffle(q.d.slice()).slice(0, Math.max(2, 7 - k))]); S.sel = [];
    } else S.opts = shuffle([q.a, ...shuffle(q.d.slice()).slice(0, 3)]);
  }
  const f = D.fiches[q.s];
  const ans = S.answered;
  const opts = S.opts.map((o, i) => {
    let cls = "";
    if (q.m) {
      const on = S.sel.includes(i), g = q.m.includes(o);
      if (ans != null) cls = g ? "good" : (on ? "bad" : "dim"); else if (on) cls = "sel";
      const mark = ans != null ? (g && on ? "✔" : g ? "!" : on ? "✘" : "") : (on ? "☑" : "☐");
      return `<button class="opt ${cls}" data-act="toggle" data-i="${i}" aria-pressed="${on}" ${ans != null ? "disabled" : ""}><span class="k">${mark}</span><span>${esc(cap(o))}${ans != null && g && !on ? " <i>(oubliée)</i>" : ""}</span></button>`;
    }
    if (ans != null) cls = o === q.a ? "good" : (i === ans ? "bad" : "dim");
    return `<button class="opt ${cls}" data-act="answer" data-i="${i}" ${ans != null ? "disabled" : ""}><span class="k">${"ABCD"[i]}</span><span>${esc(cap(o))}</span></button>`;
  }).join("");
  let after = "";
  if (ans != null) {
    const good = q.m ? S.good : S.opts[ans] === q.a;
    after = `<div class="verdict ${good ? "ok" : "ko"}">${good ? "✔ Bonne réponse" : "✘ Mauvaise réponse"}${S.gain ? `<span class="xp">+${S.gain} XP</span>` : ""}${S.streak >= 3 ? `<span class="streak">🔥 ${S.streak} d'affilée</span>` : ""}</div>
      ${S.petMsg ? `<div class="pet-say"><span class="av">${S.petMsg.em}</span><div><b>${esc(S.petMsg.name)} :</b> « ${esc(S.petMsg.text)} »</div></div>` : ""}
      ${(S.fresh || []).map(r => `<a class="unlock" href="#/corps">${r.ico}<span><b>Débloqué : ${esc(r.name)} !</b><span class="small">${esc(ZONES[r.z])} réussie à ${Math.round(TIERS[r.tierIdx] * 100)} % · Voir mon corps ›</span></span></a>`).join("")}
      ${S.petGot ? `<a class="unlock animal" href="#/menagerie">${S.petGot.em}<span><b>Nouvel animal : ${esc(S.petGot.name)} !</b><span class="small">Ajouté à ta ménagerie · Choisir comme compagnon ›</span></span></a>` : ""}
      ${S.gotKibble ? `<a class="unlock daily" href="#/corps">🍖<span><b>+1 Croquette du jour gagnée !</b><span class="small">Donne-la à ton compagnon d'étude dans Mon corps ›</span></span></a>` : ""}
      ${S.dailyGot ? `<a class="unlock daily" href="#/corps">${S.dailyGot.ico}<span><b>Cadeau du jour (5 bonnes réponses) : ${esc(S.dailyGot.name)} !</b><span class="small">${esc(S.dailyGot.desc)} · Série : ${DAILY.streak} j ›</span></span></a>` : ""}
      ${S.lvUp ? `<a class="unlock" href="#/corps">🎉<span><b>Niveau ${S.lvUp} !</b><span class="small">Nouveau titre : ${esc(title(S.lvUp))}</span></span></a>` : ""}
      ${good ? "" : `<div class="expl"><b>Réponse attendue :</b> ${esc(cap(q.m ? S.opts.filter(o => q.m.includes(o)).join(" ; ") : q.a))}</div>`}
      ${q.m && q.m.length > S.opts.filter(o => q.m.includes(o)).length ? `<div class="expl"><b>Liste complète du cours :</b> ${esc(q.a)}</div>` : ""}
      ${q.x ? `<div class="expl">${esc(q.x)}</div>` : ""}
      <div class="small" style="margin-top:8px">📄 Source : ${esc(srcText(q.src))}</div>
      ${f ? `<details><summary>Fiche complète : ${esc(cap(q.s))}</summary>${trajets(q.s)}${ficheList(f)}${palpaBlocks(f)}
        ${f.imgs && f.imgs.length ? `<details><summary>📑 Photos du cours (${f.imgs.length})</summary><div class="pics big">${imgTags(f.imgs)}</div></details>` : ""}</details>` : ""}
      <div class="actions">
        <button class="primary" data-act="next" id="nextBtn">${S.pos + 1 < S.ids.length ? "Question suivante →" : "Voir le bilan"}</button>
        <button class="flag ${FLAGS[q.id] ? "on" : ""}" data-act="flag">${FLAGS[q.id] ? "🚩 Signalée" : "🚩 Signaler une erreur"}</button>
      </div>`;
  }
  return `<div class="qhead"><span class="small">${esc(S.label)} · ${S.pos + 1} / ${S.ids.length}</span>
      <button class="flag" data-act="stop">Arrêter</button></div>
    <section class="card">
      <span class="tag">${CAT_LABEL[q.c]}${norm(q.a) === norm(q.s) && ans == null ? "" : " · " + esc(cap(q.s))}</span>
      <div class="qtext">${esc(q.q)}</div>
      ${q.img ? `<div class="pics">${imgTags(q.img)}</div>` : ""}
      ${q.m ? `<div class="small" style="margin:6px 0">☑ Plusieurs bonnes réponses : coche-les toutes, puis valide.</div>` : ""}
      <div class="opts">${opts}</div>
      ${q.m && ans == null ? `<div class="actions"><button class="primary" data-act="valid" id="nextBtn" ${S.sel.length ? "" : "disabled"}>Valider (${S.sel.length})</button></div>` : ""}
      ${after}
    </section>`;
}

function ficheList(f) {
  return `<ul class="facts">${f.facts.map(([k, v]) => `<li><b>${esc(k)}</b>${esc(v)}</li>`).join("")}</ul>
    <div class="small" style="margin-top:6px">📄 ${f.src.map(s => esc(srcText(s))).join(" · ")}</div>`;
}

function viewFiches(query) {
  const qn = norm(query || "");
  const names = Object.keys(D.fiches).filter(n => (SET.reg === "all" || D.fiches[n].reg === SET.reg) && (!qn || norm(n).includes(qn)))
    .sort((a, b) => a.localeCompare(b, "fr"));
  const groups = {};
  for (const n of names) (groups[D.fiches[n].cat] ||= []).push(n);
  const dotFor = n => {
    const s = stats(QS.filter(q => q.s === n));
    const c = s.ko ? "var(--ko)" : s.todo ? "var(--todo)" : "var(--ok)";
    return `<span class="small">${s.done}/${s.total}<span class="dot" style="background:${c}"></span></span>`;
  };
  return `<section class="card"><h2>Fiches des structures</h2>
      <p class="small">Toutes les informations de tes cours, structure par structure. Touche une fiche pour la lire ou t'interroger dessus.</p>
      <input type="search" id="search" placeholder="Rechercher (ex. médian, fémur, trapèze…)" value="${esc(query || "")}">
      <div class="chips">${Object.entries(REG_LABEL).map(([k, v]) => `<button data-act="reg" data-reg="${k}" class="${SET.reg === k ? "on" : ""}">${v}</button>`).join("")}</div>
    </section>
    ${["muscle", "nerf", "ligament", "artic", "os", "autre", "palpa"].filter(c => groups[c]).map(c => `<section class="card"><h2>${CAT_PLURAL[c]} (${groups[c].length})</h2>
      <div class="list">${groups[c].map(n => `<a href="#/fiche/${encodeURIComponent(n)}"><span>${esc(cap(n))}</span>${dotFor(n)}</a>`).join("")}</div></section>`).join("")
    || `<div class="card small">Aucune structure trouvée.</div>`}`;
}

function palpaBlocks(f) {
  return (f.palpa || []).map(b => `<div class="palpa"><b>🖐 Palpation${b.titre && norm(b.titre) !== norm(f._name || "") ? " – " + esc(b.titre) : ""}</b>
    <div>${esc(b.how)}</div><div class="small">📄 ${esc(srcText(b.src))}</div>
    ${b.imgs && b.imgs.length ? `<div class="pics">${imgTags(b.imgs)}</div>` : ""}</div>`).join("");
}
const PART_OF = D.partOf || {};
const bare = s => norm(s.replace(/\s*\(.*?\)/g, ""));
function trajets(name) {
  const want = [name, ...(PART_OF[name] || [])].map(bare), out = [];
  for (const n of Object.values(D.nerfs)) for (const m of n.muscles || []) if (want.includes(bare(m.n))) {
    let cur = n, src = n.rac ? n : null, txt = cap(n.nom);
    while (cur.parent) { txt += " → " + (cur.kind || "branche") + " de : "; cur = D.nerfs[cur.parent]; txt += cur.nom; if (!src && cur.rac) src = cur; }
    txt += src ? " → vient de " + src.rac + (src === n ? "" : " (racines de : " + src.nom + ")") : " → racines non précisées dans le cours";
    out.push([m.n, txt]);
  }
  return out.length ? `<ul class="facts">${out.map(([m, x]) => `<li><b>Trajet nerveux – ${esc(m)}</b>${esc(x)}</li>`).join("")}</ul>` : "";
}
function ficheBody(name) {
  const f = D.fiches[name];
  if (!f) return "";
  f._name = name;
  const qs = QS.filter(q => q.s === name), s = stats(qs);
  return `${trajets(name)}${f.facts.length ? ficheList(f) : ""}
    ${palpaBlocks(f)}
    ${f.imgs && f.imgs.length ? `<details ${f.cat === "nerf" ? "" : "open"}><summary>📑 Pages de tes cours (${f.imgs.length})</summary><div class="pics big">${imgTags(f.imgs)}</div></details>` : ""}
    ${qs.length ? `<p class="small" style="margin-top:12px">${s.done} QCM sur ${s.total} réalisés, ${s.ok} réussis, ${s.ko} échoués</p>${progressBlock(s)}
    <div class="actions"><button class="primary" data-act="ficheQuiz" data-name="${esc(name)}">M'interroger sur cette structure (${qs.length})</button></div>` : ""}`;
}
function viewFiche(name) {

      <div class="list">${names.map(n => `<a href="#/fiche/${encodeURIComponent(n)}"><span>${esc(cap(n))}</span>${dot(n)}</a>`).join("") || `<p class="small">Aucune structure.</p>`}</div>

function nerveCard(id, withLink) {

function viewNx(id, kind, sub) {

  const col = kids.filter(([, c]) => c.kind === "collatérale"), ter = kids.filter(([, c]) => c.kind === "terminale");
  const k = kind || (col.length ? "c" : "t");
  const shown = k === "c" ? col : ter;
  const lvLinks = (n.lv || []).map(l => `<a href="#/vert/${l}">${l}</a>`).join(" ");
  const f = D.fiches[n.fiche];
  return `<p><a href="${n.parent ? "#/nx/" + n.parent : "#/rev/nerf"}">← ${n.parent ? esc(D.nerfs[n.parent].nom) : "Révision Nerfs"}</a> ${lvLinks ? `<span class="small"> · niveaux : ${lvLinks}</span>` : ""}</p>

}

function buildRewards() {
  const out = [];
  const legacyByZone = {};
  for (const r of LEGACY_REWARDS) (legacyByZone[r.z] ||= []).push(r);
  const tierForLegacy = [1, 9, 19];
  const viewsCycle = ["f", "p", "b"];

  for (const z of Object.keys(ZONES)) {
    const leg = legacyByZone[z] || [];
    let extraIdx = 0;
    for (let ti = 0; ti < TIERS.length; ti++) {
      const pctLabel = (ti + 1) * 5;
      const legPos = tierForLegacy.indexOf(ti);
      if (legPos !== -1 && leg[legPos]) {
        const base = leg[legPos];
        out.push({ ...base, id: `${z}${legPos}`, tierIdx: ti, pctLabel });
      } else {
        const [baseName, ico] = EXTRA_POOL[(extraIdx + Object.keys(ZONES).indexOf(z) * 3) % EXTRA_POOL.length];
        const vue = viewsCycle[ti % 3];
        const vueLabel = vue === "f" ? "Face" : vue === "p" ? "Profil" : "Dos";
        const svg = extraSvg(z, vue, extraIdx);
        out.push({
          id: `${z}_p${pctLabel}`,
          z, tierIdx: ti, pctLabel,
          name: `${baseName} (${vueLabel} ${pctLabel}%)`,
          ico,
          f: vue === "f" ? svg : null,
          p: vue === "p" ? svg : null,
          b: vue === "b" ? svg : null
        });
        extraIdx++;
      }
    }
  }
  return out;
}

    ${msg ? `<div class="card small"><b>${esc(msg)}</b></div>` : ""}
    <section class="card">
      <h2>🐾 La ménagerie (${PET.got.length} / ${ANIMALS.length})</h2>
      <p class="big">Compagnon d'étude : ${comp ? `${comp.em} ${baby ? baby.em : ""} ${esc(comp.name)}` : "Aucun choisi"}</p>
      <p class="small">Croquettes disponibles : <b>${DAILY.kibbles || 0}</b> (1 gagnée par jour dès 5 bonnes réponses). Donne 1 croquette par jour à ton compagnon pour augmenter son bonheur (+20 %) : au bout de <b>5 jours nourris</b>, il a un <b>bébé</b> qui apparaît à ses côtés et dans la ménagerie !</p>
      ${comp && care ? `<div class="actions">
        <button class="primary sm" data-act="feedPet">🍖 Donner croquette (${DAILY.kibbles || 0}) · Bonheur ${care.happiness || 0} % · ${care.fedDays || 0}/5 j</button>
      </div>` : ""}
      <div class="chips">${speciesList.map(sp => `<button data-act="petFilter" data-sp="${esc(sp)}" class="${filterSp === sp ? "on" : ""}">${esc(sp)}</button>`).join("")}</div>
    </section>
    <section class="card">
      <div class="grid2">${shown.map(a => {
        const owned = PET.got.includes(a.id);
        const isComp = PET.companion === a.id;
        const c = owned ? petCare(a.id) : null;
        return `<div class="mcard ${owned ? (isComp ? "comp" : "") : ""}">
          <div class="top">
            <span class="em">${owned ? a.em : "❓"}</span>
            <div><b>${esc(owned ? a.name : "Animal mystère")}</b><span class="small">${owned ? (isComp ? `Compagnon · Bonheur ${c.happiness || 0} %` : "Débloqué") : "À découvrir en répondant juste"}</span></div>
          </div>
          ${owned ? `<button class="sm ${isComp ? "" : "primary"}" data-act="setComp" data-id="${a.id}">${isComp ? "Compagnon choisi" : "Choisir comme compagnon"}</button>` : ""}
        </div>`;
      }).join("")}</div>
    </section>`;
}

function route() { return (location.hash || "#/g").replace(/^#\/?/, "").split("/").map(decodeURIComponent); }
function render() {
  const [p0, p1] = route();
  let html, title = "Révisions anat", tab = null;
  try {
    if (!QS.length) html = `<div class="card">Les questions n'ont pas pu être chargées (fichier questions.js manquant).</div>`;
    else if (TABS.some(t => t.id === p0)) { tab = p0; html = viewTab(p0); }
    else if (p0 === "quiz") { title = "QCM"; html = viewQuiz(); }
    else if (p0 === "fiches") { title = "Fiches"; html = viewFiches(p1 || ""); }
    else if (p0 === "fiche") { title = "Fiche"; html = viewFiche(p1); }
    else if (p0 === "rev") { tab = p1 || "g"; title = "Révision"; html = viewRev(p1 || "g", route()[2] || ""); }
    else if (p0 === "vert") { title = "Vertèbre " + p1; html = viewVert(p1); }
    else if (p0 === "nx") { const r = route(); title = "Nerf"; html = viewNx(p1, r[2], r[3]); }
    else if (p0 === "corps") { title = "Mon corps d'anat"; html = viewCorps(); }
    else if (p0 === "menagerie") { title = "La ménagerie"; html = viewMenagerie(); }
    else if (p0 === "sync") { MSG = importWidget(p1 || ""); history.replaceState(null, "", "#/widget"); title = "Widget"; html = viewWidget(); }
    else if (p0 === "widget") { title = "Widget"; html = viewWidget(); }
    else if (p0 === "reglages") { title = "Réglages"; html = viewSettings(); }
    else { tab = "g"; html = viewTab("g"); }
  } catch (e) { html = `<div class="card">Erreur : ${esc(e.message)}</div>`; }
  renderTabs(tab);
  $("#app").innerHTML = html;
  $("#title").textContent = title;
  hydrateImgs();
  if (p0 === "quiz") { const n = document.getElementById("nextBtn"); if (n) n.focus({ preventScroll: true }); }
}

function answer(i) {
  const S = SESSION;
  if (!S || S.answered != null) return;
  const q = BY_ID[S.ids[S.pos]];
  S.answered = i;
  const good = q.m ? S.opts.every((o, j) => q.m.includes(o) === S.sel.includes(j)) : S.opts[i] === q.a;
  S.good = good;
  const lv0 = level(xp());
  const p = PROG[q.id] || { n: 0, ok: 0 };
  p.n++; if (good) p.ok++;
  p.r = good ? 1 : 0; p.t = Date.now();
  PROG[q.id] = p;
  save(K_PROG, PROG);

  S.fresh = syncUnlocks();
  S.petGot = recordAnimalProgress(good);
  const dRes = good ? recordDailyGoodAnswer() : { newReward: null, gotKibble: false };
  S.dailyGot = dRes.newReward;
  S.gotKibble = dRes.gotKibble;

  if (good) {
    S.streak = (S.streak || 0) + 1;
    S.badRun = 0;
  } else {
    S.streak = 0;
    S.badRun = (S.badRun || 0) + 1;
  }

  S.petMsg = null;
  const comp = PET.companion ? ANIMAL_BY_ID[PET.companion] : null;
  if (comp) {
    if (!good && S.badRun === 5) {
      const encouragements = [
        "Ne baisse pas les bras ! Même un petit passage à vide fait partie de l'apprentissage, on avance ensemble.",
        "Accroche-toi ! Cinq essais difficiles ne changent rien à tout ce que tu sais déjà, respire et repars.",
        "On ne lâche rien ! Chaque erreur te montre ce qui va devenir clair à la prochaine lecture."
      ];
      S.petMsg = { em: comp.em, name: comp.name, text: encouragements[Math.floor(Math.random() * encouragements.length)] };
    } else if (good && S.streak === 20) {
      S.petMsg = { em: comp.em, name: comp.name, text: "Mon maître, c'est le plus fort !" };
    }
  }

  S.gain = (good ? 10 : 0) + S.fresh.length * 50 + (S.petGot ? 40 : 0) + (S.dailyGot ? 35 : 0) + (S.gotKibble ? 15 : 0);
  S.xp = (S.xp || 0) + S.gain;
  const lv1 = level(xp()); S.lvUp = lv1 > lv0 ? lv1 : 0;
  if (good) S.ok++; else { S.ko++; (S.wrong ||= []).push(q.id); }
  render();
}

const ACT = {
  zone: el => { ZSEL = ZSEL === el.dataset.z && !el.dataset.from ? null : el.dataset.z; render(); if (el.dataset.from) { const z = document.getElementById("zpanel"); if (z) z.scrollIntoView({ behavior: "smooth", block: "start" }); } },
  bview: el => { BODY.view = el.dataset.v; save(K_BODY, BODY); render(); },
  equip: el => { const r = R_BY[el.dataset.id]; BODY.eq[r.id] = !isEq(r); save(K_BODY, BODY); render(); },
  eqDaily: el => {
    const r = DAILY_BY_ID[el.dataset.id];
    if (!r) return;
    DAILY.equipped[r.cat] = DAILY.equipped[r.cat] === r.id ? null : r.id;
    save(K_DAILY, DAILY);
    render();
  },
  feedPet: () => {
    const res = feedCompanionKibble();
    MSG = res.msg;
    render();
  },
  petFilter: el => { window._petFilter = el.dataset.sp; render(); },
  setComp: el => { PET.companion = el.dataset.id; petCare(el.dataset.id); save(K_PET, PET); render(); },
  zoneQuiz: el => {
    const z = el.dataset.z;
    const koList = shuffle((ZQ[z] || []).filter(q => status(q) === "ko").map(q => q.id));
    const todoList = shuffle((ZQ[z] || []).filter(q => status(q) === "todo").map(q => q.id));
    let l = [...koList, ...todoList];
    if (SET.len < 100) l = l.slice(0, SET.len);
    startSession("corps", "todo", l, "Zone : " + ZONES[z]);
  },
  start: el => startSession(el.dataset.tab, el.dataset.pool),
  reg: el => { SET.reg = el.dataset.reg; save(K_SET, SET); render(); },
  answer: el => answer(Number(el.dataset.i)),
  toggle: el => { const S = SESSION, i = Number(el.dataset.i); if (S.answered != null) return; S.sel = S.sel.includes(i) ? S.sel.filter(x => x !== i) : [...S.sel, i]; render(); },
  valid: () => { if (SESSION.sel.length) answer(0); },
  dlImgs: async el => {
    const packs = [...new Set(Object.values(D.imgs || {}))]; let ok = 0;
    el.disabled = true;
    for (const p of packs) { try { const r = await fetch(p + ".js"); if (r.ok) { await r.blob(); ok++; } } catch {} el.textContent = `Téléchargement… ${ok} / ${packs.length}`; }
    el.textContent = ok === packs.length ? "✔ Toutes les images sont disponibles hors ligne" : `${packs.length - ok} fichier(s) manquant(s) : vérifie les images-XX.js sur GitHub`;
    el.disabled = false;
  },
  next: () => { SESSION.pos++; SESSION.answered = null; SESSION.opts = null; SESSION.petMsg = null; render(); window.scrollTo(0, 0); },
  stop: () => { SESSION.ids = SESSION.ids.slice(0, SESSION.pos + (SESSION.answered != null ? 1 : 0)); SESSION.pos = SESSION.ids.length; render(); },
  redoKo: () => startSession(SESSION.tab, "ko", shuffle(SESSION.wrong.slice()), "Erreurs de la série"),
  flag: () => { const id = SESSION.ids[SESSION.pos]; if (FLAGS[id]) delete FLAGS[id]; else FLAGS[id] = Date.now(); save(K_FLAG, FLAGS); render(); },
  ficheQuiz: el => startSession(null, "todo", shuffle(QS.filter(q => q.s === el.dataset.name).map(q => q.id)), el.dataset.name),
  fixQ: el => {
    const q = BY_ID[el.dataset.id];
    const nq = prompt("Question :", q.q); if (nq === null || !nq.trim()) return;
    const na = prompt(q.m ? "Bonnes réponses (séparées par « ; » avec un espace de chaque côté) :" : "Bonne réponse :", q.a); if (na === null || !na.trim()) return;
    OVR[q.id] = { q: nq.trim(), a: na.trim() }; save(K_OVR, OVR); applyOvr();
    if (confirm("Correction enregistrée. Retirer le signalement ?")) { delete FLAGS[q.id]; save(K_FLAG, FLAGS); }
    render();
  },
  flagQuiz: () => startSession(null, "todo", Object.keys(FLAGS).filter(id => BY_ID[id]), "Questions signalées"),
  copyFlags: async () => {
    const txt = Object.keys(FLAGS).map(id => BY_ID[id]).filter(Boolean).map(q => `- [${q.id}] ${q.q} → ${q.a}`).join("\n");
    try { await navigator.clipboard.writeText(txt); MSG = "Liste copiée : tu peux la coller dans un message."; } catch { MSG = "Copie impossible sur ce navigateur."; }
    render();
  },
  export: () => {
    const data = { app: "revisions-anat", version: 2, exportedAt: new Date().toISOString(), progress: PROG, flags: FLAGS, corrections: OVR, body: BODY, pet: PET, daily: DAILY };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
    a.download = `revisions-anat-progression-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    MSG = "Fichier enregistré dans tes Téléchargements.";
    render();
  },
  import: () => document.getElementById("importFile").click(),
  reset: () => {
    if (!confirm("Effacer toute ta progression ? C'est définitif (sauf si tu as un export).")) return;
    PROG = {}; save(K_PROG, PROG); BODY.got = []; save(K_BODY, BODY);
    PET = { got: [], companion: null, targetGood: randomTarget(), goodSincePet: 0, dayKey: todayKey(), dayCount: 0, care: {} }; save(K_PET, PET);
    DAILY = { streak: 0, lastActiveDay: null, todayKey: todayKey(), todayGood: 0, todayRewardClaimed: false, kibbleEarnedToday: false, kibbles: 0, got: [], equipped: { coiffure: null, decor: null, animal_gear: null, tableau: null } }; save(K_DAILY, DAILY);
    MSG = "Progression effacée."; render();
  }
};

document.addEventListener("click", e => {
  if (e.target.matches("img.pic[src]")) {
    const z = document.createElement("div"); z.id = "zoom"; z.innerHTML = `<img src="${e.target.src}" alt="">`;
    z.onclick = () => z.remove(); document.body.appendChild(z); return;
  }
  const el = e.target.closest("[data-act]");
  if (!el || !ACT[el.dataset.act] || el.disabled) return;
  e.preventDefault();
  ACT[el.dataset.act](el);
});
document.addEventListener("input", e => {
  if (e.target.dataset.set === "len") {
    SET.len = Number(e.target.value); save(K_SET, SET);
    const o = document.getElementById("lenOut"); if (o) o.textContent = SET.len >= 100 ? "Tous" : SET.len;
  } else if (e.target.id === "search") {
    const v = e.target.value, pos = e.target.selectionStart, tb = e.target.dataset.tab;
    history.replaceState(null, "", (tb ? "#/rev/" + tb + "/" : "#/fiches/") + encodeURIComponent(v));
    $("#app").innerHTML = tb ? viewRev(tb, v) : viewFiches(v);
    const s = document.getElementById("search"); s.focus(); try { s.setSelectionRange(pos, pos); } catch {}
  }
});
document.addEventListener("change", async e => {
  if (e.target.id !== "importFile") return;
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || data.app !== "revisions-anat" || typeof data.progress !== "object") throw new Error("ce n'est pas un export de Révisions anat");
    if (!confirm("Remplacer ta progression actuelle par celle de ce fichier ?")) return;
    PROG = data.progress; FLAGS = data.flags || {}; OVR = data.corrections || {};
    if (data.body) { BODY = data.body; save(K_BODY, BODY); }
    if (data.pet) { PET = data.pet; PET.care ||= {}; save(K_PET, PET); }
    if (data.daily) { DAILY = data.daily; save(K_DAILY, DAILY); }
    save(K_OVR, OVR); applyOvr(); save(K_PROG, PROG); save(K_FLAG, FLAGS);
    MSG = "Progression importée.";
  } catch (err) { MSG = "Import impossible : " + err.message; }
  render();
});
document.addEventListener("keydown", e => {
  if (route()[0] !== "quiz" || !SESSION || e.target.tagName === "INPUT") return;
  const k = e.key.toUpperCase();
  const cur = BY_ID[SESSION.ids[SESSION.pos]];
  if (cur && cur.m && SESSION.answered == null && SESSION.opts) {
    const n = Number(e.key) - 1;
    if (n >= 0 && n < SESSION.opts.length) ACT.toggle({ dataset: { i: n } });
    else if (e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); ACT.valid(); }
    return;
  }
  const i = "ABCD".indexOf(k) >= 0 ? "ABCD".indexOf(k) : "1234".indexOf(e.key);
  if (i >= 0 && SESSION.answered == null && SESSION.opts && i < SESSION.opts.length) answer(i);
  else if ((e.key === "Enter" || e.key === " ") && SESSION.answered != null) { e.preventDefault(); ACT.next(); }
});
window.addEventListener("hashchange", render);
document.addEventListener("toggle", e => { if (e.target.open) hydrateImgs(); }, true);
render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
